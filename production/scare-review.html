<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#05080b;color:#d3d8cd;font:13px monospace}main{max-width:1200px;margin:20px auto}header{display:flex;align-items:center;gap:20px;padding:15px}select,button{padding:12px;background:#202b28;color:#e2e9df;border:1px solid #768173}input{flex:1}canvas{display:block;width:100%;height:auto}#scare-overlay{display:none}</style><script>window.DGScareReviewEnabled=true</script><script src="action-atlas.js" defer></script><script src="action-timelines.js" defer></script><script src="action-scares.js" defer></script></head><body><div id="scare-overlay"><div class="scare-stage"></div><strong></strong></div><main><header><select id="scene" aria-label="Review character"><option value="0">Jason</option><option value="1">Freddy</option><option value="2">Myers</option><option value="3">Creeper</option></select><input id="time" aria-label="Scene time" type="range" min="0" max="4500" value="1700" step="10"><output id="elapsed">1700 ms</output><button id="play">Play sequence</button></header><canvas id="review" width="1200" height="800"></canvas></main><script>window.addEventListener('load',()=>{const time=document.querySelector('#time'),scene=document.querySelector('#scene'),canvas=document.querySelector('#review'),out=document.querySelector('#elapsed');let playing=false,last;function draw(){if(!window.DGScareReview?.ready(Number(scene.value))){requestAnimationFrame(draw);return}window.DGScareReview.render(Number(scene.value),Number(time.value),canvas);out.textContent=time.value+' ms'}time.oninput=draw;scene.onchange=draw;document.querySelector('#play').onclick=()=>{playing=!playing;if(!playing)return;time.value=0;last=performance.now();const loop=now=>{if(!playing)return;time.value=Math.min(4500,Number(time.value)+now-last);last=now;draw();if(Number(time.value)<4500)requestAnimationFrame(loop);else playing=false};requestAnimationFrame(loop)};draw()});</script></body></html>
